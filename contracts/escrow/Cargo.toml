[package]
name = "paytag-escrow"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Test only: used to produce verifier signatures. Never enters the contract wasm.
ed25519-dalek = "2"
proptest = "1"
