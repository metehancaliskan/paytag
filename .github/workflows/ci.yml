name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# This repo will be PUBLIC on delivery. No step needs write access to it.
permissions:
  contents: read

jobs:
  contracts:
    name: Soroban contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all -- --nocapture

      - name: Build wasm (release)
        run: cargo build --target wasm32v1-none --release

      - name: Wasm size report
        run: ls -l target/wasm32v1-none/release/*.wasm

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Phase 3.4 gate. If the TypeScript identity_key ever stops matching
      # the Rust one, every claim silently looks under the wrong tag — so this
      # runs before anything else and its failure fails the build.
      - name: Parity and unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `lib/config.ts` throws on a missing variable by design, so the build
      # needs the public ones. No secret is used or needed here: nothing in a
      # production build reads VERIFIER_SECRET or the service role key.
      #
      # THE THREE `need()` CALLS IN lib/config.ts MUST ALL APPEAR BELOW. The
      # variable that is easy to forget is XLM: it arrived with the native
      # asset and this block was updated in the same commit, minus that one
      # line, so the build threw on a variable nothing else in CI wanted.
      # Missing one fails the build with a clear message, which is the design
      # working; the fix is always to add it here, never to soften `need()`.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CDN2BQNGHWCC22IXLAKBAVIOL5ID4MTH4FNYISVEARWQ4HZ27ZA7OZ3B
          NEXT_PUBLIC_XLM_SAC_ID: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
          NEXT_PUBLIC_USDC_SAC_ID: CBU7HRUSXSVPI7QHA73G67UDRQTKSEOICFHWOMWSPOZ2S3R3DIWUCPKI

      - name: The verifier CLI agrees with the spec
        working-directory: .
        run: node scripts/paytag.mjs selftest

  secrets:
    name: Secret leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The scanner's own test suite
        run: ./scripts/test-scan-secrets.sh

      - name: Our own scanner (every tracked file)
        run: ./scripts/scan-secrets.sh --tree

      # The gitleaks Action WRAPPER charges org accounts and scans nothing
      # without a licence. gitleaks ITSELF is MIT and free.
      # We install the binary with a pinned version and a verified SHA256.
      - name: Install gitleaks (MIT binary)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact is MANDATORY: once the repo is public, the Actions logs are
      # public too. Without redaction the secret that was found gets printed
      # into the very log line that reports the leak.
      - name: gitleaks — ENTIRE COMMIT HISTORY
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --verbose \
            --exit-code 1

      - name: Check history for a .env leak
        run: |
          if git log --all --diff-filter=A --name-only --pretty=format: \
             | sort -u | grep -vE '\.example$' | grep -E '(^|/)\.env|\.pem$|\.key$|\.stellar/' ; then
            echo "::error::The files above were added at some point in history. Apply docs/SECURITY.md section 5."
            exit 1
          fi
          echo "History is clean."
