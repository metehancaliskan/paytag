name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Bu repo teslimde PUBLIC olacak. Hiçbir adımın repoya yazması gerekmiyor.
permissions:
  contents: read

jobs:
  contracts:
    name: Soroban contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all -- --nocapture

      - name: Build wasm (release)
        run: cargo build --target wasm32v1-none --release

      - name: Wasm size report
        run: ls -l target/wasm32v1-none/release/*.wasm

  secrets:
    name: Sır sızıntısı taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tarayıcının kendi testi
        run: ./scripts/test-scan-secrets.sh

      - name: Kendi tarayıcımız (takip edilen tüm dosyalar)
        run: ./scripts/scan-secrets.sh --tree

      # gitleaks Action SARMALAYICISI org hesaplarından ücret ister ve
      # lisanssız hiç taramaz. gitleaks'in KENDİSİ MIT ve ücretsiz.
      # İkiliyi sürüm sabitleyip SHA256 doğrulayarak kuruyoruz.
      - name: gitleaks kur (MIT ikili)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact ZORUNLU: repo public olunca Actions logları da public olur.
      # Redact yoksa bulunan sır, sızıntıyı bildiren log satırına basılır.
      - name: gitleaks — TÜM COMMIT GEÇMİŞİ
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --verbose \
            --exit-code 1

      - name: .env sızıntısı geçmişte var mı
        run: |
          if git log --all --diff-filter=A --name-only --pretty=format: \
             | sort -u | grep -vE '\.example$' | grep -E '(^|/)\.env|\.pem$|\.key$|\.stellar/' ; then
            echo "::error::Yukarıdaki dosyalar geçmişte bir noktada eklenmiş. docs/SECURITY.md bölüm 5'i uygula."
            exit 1
          fi
          echo "Geçmiş temiz."
